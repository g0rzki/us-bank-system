services:
  mock-gateways:
    build:
      context: .
      dockerfile: src/UsBankSystem.MockGateways/Dockerfile
    ports:
      - "6001:6001"
      - "6002:6002"
      - "6003:6003"
      - "6004:6004"
      - "6006:6006"
    environment:
      - API_URL=http://api:8080
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - KLIK_WEBHOOK_SECRET=${KLIK_WEBHOOK_SECRET}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/UsBankSystem.Api/Dockerfile
    # Serwis dostępny pod nazwą 'us-bank-a' w sieci cards-backend —
    # card-provider oddzwania na http://us-bank-a:8000/capture przy settlement.
    # ASPNETCORE_URLS dodaje port 8000 (domyślny obraz aspnet:8.0 słucha tylko na 8080).
    container_name: us-bank-a
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080;http://+:8000
      - ConnectionStrings__Default=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Webhook__Secret=${WEBHOOK_SECRET}
      - Cors__Origin=http://localhost:${FRONTEND_PORT}
      - Integrations__RtpUrl=http://mock-gateways:6002
      - Integrations__RtpTchUrl=${INTEGRATIONS_RTP_TCH_URL:-http://host.docker.internal:8000}
      - Rtp__ApiKey=${Rtp__ApiKey:-}
      - Integrations__FedNowMqUrl=${INTEGRATIONS_FEDNOW_MQ_URL:-http://host.docker.internal:8770}
      - Integrations__SwiftUrl=${INTEGRATIONS_SWIFT_URL:-http://host.docker.internal:3000}
      - Swift__ClientId=${Swift__ClientId:-test-client}
      - Swift__ClientSecret=${Swift__ClientSecret:-test-secret}
      - Swift__Bic=${Swift__Bic:-USBKUS01XXX}
      - Swift__WebhookSecret=${Swift__WebhookSecret:-}
      - Integrations__CardsUrl=${INTEGRATIONS_CARDS_URL}
      - Integrations__BlikUrl=${INTEGRATIONS_BLIK_URL:-http://mock-gateways:6006}
      - Integrations__KlikApiKey=${INTEGRATIONS_KLIK_API_KEY:-dev-key}
      - Klik__WebhookSecret=${KLIK_WEBHOOK_SECRET}
      - Klik__AllowUnsignedWebhooks=${KLIK_ALLOW_UNSIGNED_WEBHOOKS:-false}
      - Cards__ApiKey=${CARDS_API_KEY}
      - Cards__HmacSecret=${CARDS_HMAC_SECRET}
      - Cards__AdminKey=${CARDS_ADMIN_KEY}
      - Ach__Sftp__PrivateKeyPath=/sftp_keys/id_rsa
      - Ach__RoutingNumber=${Ach__RoutingNumber:-110000000}
      - Ach__LegalName=${Ach__LegalName:-US Bank A}
      - Ach__CompanyId=${Ach__CompanyId:-110000000}
      - Ach__FrbRoutingNumber=${Ach__FrbRoutingNumber:-090000515}
      - Ach__FrbName=${Ach__FrbName:-FRB Tungsten}
      - Ach__Sftp__Host=${Ach__Sftp__Host:-host.docker.internal}
      - Ach__Sftp__Port=${Ach__Sftp__Port:-2221}
      - Ach__Sftp__Username=${Ach__Sftp__Username:-us-bank-a}
      - Ach__Sftp__HostFingerprint=${Ach__Sftp__HostFingerprint:-}
      - Ach__Sftp__AllowUncheckedFingerprint=${Ach__Sftp__AllowUncheckedFingerprint:-false}
      - Ach__PollIntervalSeconds=${Ach__PollIntervalSeconds:-60}
    volumes:
      - ../payment-settlement-systems/FedSystems/SFTP_Keys/us-bank-a:/sftp_keys:ro
    depends_on:
      db:
        condition: service_healthy
      mock-gateways:
        condition: service_started
    networks:
      default: {}
      clearing-us-a-karty:
        aliases:
          - us-bank-a
      target_klik:
        aliases:
          - us-bank-a
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${API_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

networks:
  clearing-us-a-karty:
    # Zewnętrzna sieć tworzona przez Karty-Platnicze-Aplikacje-Biznesowe.
    # Hostuje card-provider (/capture) i payment-gateway (Integrations__CardsUrl).
    # Uruchom tamten projekt pierwszy, żeby sieć istniała przed startem tego compose.
    external: true
  target_klik:
    # Zewnętrzna sieć tworzona przez KLIK-payments.
    # Serwis 'web' (Django KLIK, port 8000) jest w tej sieci.
    # Uruchom KLIK-payments pierwszy, żeby sieć istniała.
    external: true