services:
  mock-gateways:
    build:
      context: .
      dockerfile: src/UsBankSystem.MockGateways/Dockerfile
    ports:
      - "6001:6001"
      - "6002:6002"
      - "6003:6003"
      - "6004:6004"
    environment:
      - API_URL=http://api:8080
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/UsBankSystem.Api/Dockerfile
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Webhook__Secret=${WEBHOOK_SECRET}
      - Cors__Origin=${CORS_ORIGIN}
      - Integrations__AchUrl=http://mock-gateways:6001
      - Integrations__RtpUrl=http://mock-gateways:6002
      - Integrations__FedNowUrl=http://mock-gateways:6003
      - Integrations__SwiftUrl=http://mock-gateways:6004
      - Integrations__CardsUrl=${INTEGRATIONS_CARDS_URL}
      - Integrations__BlikUrl=${INTEGRATIONS_BLIK_URL}
    depends_on:
      db:
        condition: service_healthy
      mock-gateways:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: